name: "CodeQL"

on:
  push:
    branches-ignore:
      - '*WIP'
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main", "v1.0.0-alpha.1" ]
  schedule:
    - cron: '20 11 * * 3'

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ (matrix.language == 'swift' && 'macos-26') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'swift' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      # DictionaryCoding requires the Swift 6.3 toolchain (swift-tools-version: 6.3).
      run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

    - name: Verify Swift Version
      run: |
        swift --version
        swift package --version

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - run: |
        echo "Run, Build Application using script"
        swift build

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
